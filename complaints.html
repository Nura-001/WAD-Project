<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Complaints | CampusCare</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <style>

        .complaints-page {
            min-height: 100vh;
            background: #f5f7fb;
        }

        .complaints-container {
            max-width: 1100px;
            margin: auto;
            padding: 50px 20px;
        }

        .complaints-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .complaints-header h1 {
            font-size: 30px;
            color: #111827;
            margin-bottom: 8px;
        }

        .complaints-header p {
            color: #6b7280;
        }

        .new-complaint-btn {
            display: inline-flex;
            padding: 12px 18px;
            background: #2563eb;
            color: white;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .new-complaint-btn:hover {
            background: #1d4ed8;
        }

        .filter-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-box select {
            padding: 11px 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            background: white;
            font-family: inherit;
            outline: none;
        }

        .complaints-list {
            display: grid;
            gap: 15px;
        }

        .complaint-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 15px;
            padding: 22px;
        }

        .complaint-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .complaint-card h2 {
            font-size: 17px;
            color: #111827;
            margin-bottom: 7px;
        }

        .complaint-id {
            color: #9ca3af;
            font-size: 11px;
        }

        .complaint-card-category {
            color: #2563eb;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .complaint-card-description {
            color: #6b7280;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .complaint-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }

        .meta-item {
            font-size: 11px;
            color: #6b7280;
            background: #f8fafc;
            padding: 7px 10px;
            border-radius: 7px;
        }

        .empty-state {
            text-align: center;
            background: white;
            padding: 60px 20px;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty-state h2 {
            color: #111827;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #6b7280;
            margin-bottom: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {

            .complaints-container {
                padding: 30px 15px;
            }

            .complaints-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .complaint-card-top {
                flex-direction: column;
            }

            .filter-box {
                width: 100%;
            }

            .filter-box select {
                width: 100%;
            }

        }

    </style>

</head>

<body>

    <div class="complaints-page">


        <!-- Navbar -->

        <header class="navbar">

            <div class="container nav-container">

                <a href="dashboard.html" class="logo">

                    <span class="logo-icon">
                        C
                    </span>

                    <span>
                        CampusCare
                    </span>

                </a>


                <nav class="nav-menu">

                    <a href="dashboard.html">
                        Dashboard
                    </a>

                    <a href="complaint.html">
                        Submit Complaint
                    </a>

                    <a href="complaints.html">
                        My Complaints
                    </a>

                    <a href="feedback.html">
                        Feedback
                    </a>

                    <a href="#" id="logoutBtn">
                        Logout
                    </a>

                </nav>

            </div>

        </header>


        <main class="complaints-container">


            <div class="complaints-header">

                <div>

                    <h1>
                        My Complaints
                    </h1>

                    <p>
                        Track all your submitted complaints.
                    </p>

                </div>


                <a
                    href="complaint.html"
                    class="new-complaint-btn"
                >
                    + New Complaint
                </a>

            </div>


            <!-- Filter -->

            <div class="filter-box">

                <select id="statusFilter">

                    <option value="all">
                        All Complaints
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="Resolved">
                        Resolved
                    </option>

                </select>

            </div>


            <!-- Complaint List -->

            <div
                id="complaintsList"
                class="complaints-list"
            >

                <div class="empty-state">

                    <div class="empty-icon">
                        📋
                    </div>

                    <h2>
                        No Complaints Yet
                    </h2>

                    <p>
                        You haven't submitted any complaints yet.
                    </p>

                    <a
                        href="complaint.html"
                        class="new-complaint-btn"
                    >
                        Submit Your First Complaint
                    </a>

                </div>

            </div>

        </main>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
